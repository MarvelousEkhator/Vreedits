<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Vreedits is offline</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 24px; color: #fff;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      background: linear-gradient(160deg, #02060E, #9303C5);
    }
    img { width: 96px; height: 96px; border-radius: 22px; margin-bottom: 20px; }
    h1 { font-size: 24px; margin: 0 0 8px; }
    p { margin: 0 0 24px; opacity: 0.85; max-width: 320px; line-height: 1.5; }
    button {
      border: none; border-radius: 24px; padding: 12px 24px; font-size: 15px; font-weight: 600;
      background: #fff; color: #5b0680; cursor: pointer;
    }
  </style>
</head>
<body>
  <img src="/icons/icon-192.png" alt="Vreedits" />
  <h1>You're offline</h1>
  <p>Vreedits needs a connection to load your study tools. Check your internet and try again.</p>
  <button onclick="location.reload()">Try again</button>
</body>
</html>
