name: Daily birthday emails

on:
  schedule:
    - cron: "0 7 * * *"
  workflow_dispatch:

jobs:
  birthdays:
    runs-on: ubuntu-latest
    steps:
      - name: Call birthday route
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          curl --fail --show-error --silent \
            --max-time 180 --retry 2 --retry-delay 20 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://synovra-i8yr.onrender.com/api/cron/birthday